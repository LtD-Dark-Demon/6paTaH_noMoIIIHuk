name: Build APK
on:
  push:
    branches: [main, "work/bratan-v3-recovery"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build release
        run: chmod +x gradlew && ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Package full source project
        run: zip -r BratanAssistant-3.0-source.zip . -x '.git/*' '.gradle/*' 'app/build/*' 'BratanAssistant-3.0-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: bratan-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bratan-project
          path: BratanAssistant-3.0-source.zip
